
name: Build SAAD SCADA APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p work
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d work
          PROJECT_DIR=$(find work -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin JVM Target
        run: |
          cat > "$RUNNER_TEMP/fix-jvm.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.class.name.contains("KotlinCompile") &&
                      task.hasProperty("kotlinOptions")) {
                      task.kotlinOptions.jvmTarget = "1.8"
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon \
            --init-script "$RUNNER_TEMP/fix-jvm.gradle" \
            -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAAD-SCADA-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
